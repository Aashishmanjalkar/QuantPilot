# Full QuantPilot stack. Usage: docker compose up --build
# Secrets come from the environment / a git-ignored .env (QP-STD-006); see .env.example.
name: quantpilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: quantpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantpilot -d quantpilot"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  quant:
    build:
      context: services/quant
    environment:
      QUANT_DATA_PROVIDER: ${QUANT_DATA_PROVIDER:-yfinance}
      QUANT_CACHE_DATABASE_URL: postgresql://quantpilot:${POSTGRES_PASSWORD}@postgres:5432/quantpilot
    depends_on:
      postgres:
        condition: service_healthy
    # Internal only: no published port (docs/architecture.md).
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://quantpilot:${POSTGRES_PASSWORD}@postgres:5432/quantpilot
      REDIS_URL: redis://redis:6379
      QUANT_URL: http://quant:8000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      RUN_WORKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      quant:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
