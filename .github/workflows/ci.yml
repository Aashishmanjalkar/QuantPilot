name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quant:
    name: Python (services/quant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/quant/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: python scripts/export_schema.py --check
      - run: pytest

  node:
    name: Node (apps, packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  api-integration:
    name: API integration (Postgres + Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f compose.test.yaml up -d --wait
      - run: pnpm test:integration
      - if: always()
        run: docker compose -f compose.test.yaml down -v

  e2e:
    name: E2E (full stack, fixture data)
    runs-on: ubuntu-latest
    needs: [quant, node]
    env:
      POSTGRES_PASSWORD: ci-only
      QUANT_DATA_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quantpilot/e2e exec playwright install --with-deps chromium
      - run: docker compose -p quantpilot-e2e up -d --build --wait
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose -p quantpilot-e2e logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: always()
        run: docker compose -p quantpilot-e2e down -v
